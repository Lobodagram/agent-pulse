[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pulse-local"
dynamic = ["version"]
description = "Local deterministic agent workflow evidence and subscription counters"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Lobodagram"}]
dependencies = []

[project.scripts]
agent-pulse = "collector:main"
agent-pulse-mcp = "mcp_server:main"

[tool.setuptools]
packages = []
py-modules = ["agent_control", "provider_secrets", "glm_quota", "sanitizers", "pulse_version", "hook_bridge", "capability_detection", "finding_review", "review_pack", "collector", "providers", "platform_support", "journal", "journal_cli", "analytics", "instrumentation", "mcp_server", "session_view", "model_evidence", "capability_report", "evidence_pack", "command_profile", "result_metadata", "compact_summary"]

[tool.setuptools.dynamic]
version = {attr = "pulse_version.__version__"}
