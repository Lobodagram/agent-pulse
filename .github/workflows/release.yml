name: Release packages
on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish after a tests/docs-only CI correction; blank builds artifacts only'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  gate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
      source: ${{ steps.release.outputs.source }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select exact checked source and unpublished version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PULSE_EVENT: ${{ github.event_name }}
          PULSE_HEAD: ${{ github.event.workflow_run.head_sha || github.sha }}
          PULSE_MANUAL_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(python -c 'from pulse_version import __version__; print(__version__)')"
          build=true
          publish=false
          if [[ "$PULSE_EVENT" == workflow_run ]]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current" != "$PULSE_HEAD" ]]; then build=false; fi
            # A missing ref is checked through git; API/auth failures never mean missing.
            git ls-remote --tags origin "refs/tags/$tag" > "$RUNNER_TEMP/pulse-tag-ref"
            if [[ -s "$RUNNER_TEMP/pulse-tag-ref" ]]; then build=false; fi
            publish=true
          elif [[ "$GITHUB_REF_TYPE" == tag || -n "$PULSE_MANUAL_TAG" ]]; then
            publish=true
          fi
          if [[ -n "$PULSE_MANUAL_TAG" ]]; then test "$PULSE_MANUAL_TAG" = "$tag"; fi
          {
            echo "build=$build"
            echo "publish=$publish"
            echo "source=$PULSE_HEAD"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
  package:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: windows-2022
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag against canonical version
        run: >-
          python -c "import os; from pulse_version import __version__; assert os.environ.get('GITHUB_REF_TYPE') != 'tag' or os.environ.get('GITHUB_REF_NAME') == 'v'+__version__; print(__version__)"
      - name: Verify manual publication has identical runtime and build inputs
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          PULSE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python -c "import os,subprocess; from pulse_version import __version__; tag=os.environ['PULSE_RELEASE_TAG']; assert tag=='v'+__version__, 'release_tag_version_mismatch'; subprocess.run(['git','fetch','--no-tags','origin','tag',tag],check=True); changed=subprocess.check_output(['git','diff','--name-only',tag,'HEAD'],text=True).splitlines(); allowed=lambda p: p.startswith(('tests/','docs/')) or p in ('README.md','README.ru.md','CHANGELOG.md','.github/workflows/release.yml'); assert all(allowed(p) for p in changed), 'tag_runtime_or_build_drift'; print('Identical tagged runtime/build inputs; tests/docs/workflow-only correction:',changed)"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements-build.txt
      - if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --contents-directory pulse-runtime --name pulse-collector --distpath .build collector.py
          ./build.sh
          'dist/Agent Pulse.app/Contents/MacOS/AgentPulse' --fixture examples/demo.json --snapshot .build/widget.png
          python scripts/widget_smoke.py 'dist/Agent Pulse.app/Contents/MacOS/AgentPulse'
          python scripts/model_ui_smoke.py 'dist/Agent Pulse.app/Contents/MacOS/AgentPulse'
          python scripts/chart_ui_smoke.py 'dist/Agent Pulse.app/Contents/MacOS/AgentPulse'
          'dist/Agent Pulse.app/Contents/Resources/pulse-collector' catalog > .build/catalog.json
          python scripts/frozen_smoke.py 'dist/Agent Pulse.app/Contents/Resources/pulse-collector'
          cp LICENSE LICENSE-MIT.txt NOTICE 'dist/Agent Pulse.app/Contents/Resources/'
          python scripts/runtime_notices.py 'dist/Agent Pulse.app/Contents/Resources/Licenses'
          codesign --force --sign - 'dist/Agent Pulse.app'
          codesign --verify --deep --strict 'dist/Agent Pulse.app'
          ditto -c -k --sequesterRsrc --keepParent 'dist/Agent Pulse.app' 'dist/agent-pulse-${{ matrix.artifact }}.zip'
      - if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --contents-directory pulse-runtime --console --name pulse-collector --distpath .build collector.py
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item .build/pulse-collector/* dist/ -Recurse -Force
          & ./dist/pulse-collector.exe catalog
          python scripts/frozen_smoke.py dist/pulse-collector.exe
          if ($LASTEXITCODE -ne 0) { throw 'Frozen hook/journal/MCP smoke failed' }
          & ./dist/pulse-collector.exe tls-check
          if ($LASTEXITCODE -ne 0) { throw "Frozen Windows TLS verification failed" }
          if ($LASTEXITCODE -ne 0) { throw "Frozen collector failed" }
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name AgentPulse --icon brand/AgentPulse.ico --add-data "brand:brand" --paths . windows/agent_pulse.py
          python windows/agent_pulse.py --fixture examples/demo.json --smoke
          python -c "import json,pathlib; p=pathlib.Path('.build'); p.mkdir(exist_ok=True); d=json.loads(pathlib.Path('examples/demo.json').read_text(encoding='utf-8')); d['providers'][1]['quotas']=d['providers'][0]['quotas']; (p/'two-quotas.json').write_text(json.dumps(d),encoding='utf-8')"
          python windows/agent_pulse.py --fixture .build/two-quotas.json --smoke
          python windows/agent_pulse.py --fixture .build/two-quotas.json --smoke --language ru
          $demo = (Resolve-Path examples/demo.json).Path
          $smoke = Start-Process -FilePath dist/AgentPulse.exe -ArgumentList '--fixture',"`"$demo`"",'--smoke' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            python -m PyInstaller --clean --noconfirm --onefile --console --name AgentPulseDebug --icon brand/AgentPulse.ico --add-data "brand:brand" --paths . windows/agent_pulse.py
            & ./dist/AgentPulseDebug.exe --fixture $demo --smoke
            throw 'Packaged Windows smoke failed; diagnostic output above'
          }
          $quotaDemo = (Resolve-Path .build/two-quotas.json).Path
          $quotaSmoke = Start-Process -FilePath dist/AgentPulse.exe -ArgumentList '--fixture',"`"$quotaDemo`"",'--smoke' -Wait -PassThru
          if ($quotaSmoke.ExitCode -ne 0) { throw 'Packaged Windows two-quota layout smoke failed' }
          $ruSmoke = Start-Process -FilePath dist/AgentPulse.exe -ArgumentList '--fixture',"`"$quotaDemo`"",'--smoke','--language','ru' -Wait -PassThru
          if ($ruSmoke.ExitCode -ne 0) { throw 'Packaged Russian Windows layout smoke failed' }
          python scripts/runtime_notices.py dist/Licenses
          Compress-Archive -Path dist/AgentPulse.exe,dist/pulse-collector.exe,dist/pulse-runtime,dist/Licenses,LICENSE,LICENSE-MIT.txt,NOTICE,README.md,README.ru.md -DestinationPath 'dist/agent-pulse-${{ matrix.artifact }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-pulse-${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
  publish:
    needs: [gate, package]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source }}
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - run: cd packages && sha256sum *.zip > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_SOURCE: ${{ needs.gate.outputs.source }}
          PULSE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$PULSE_EVENT" == workflow_run ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SOURCE"
            # Creating the release creates only the new exact tag; never move an existing tag.
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
              test "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)" = "$RELEASE_SOURCE"
            else
              test "$?" = 2
            fi
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_SOURCE" --prerelease --title "Agent Pulse $RELEASE_TAG — public preview / публичная версия" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber
