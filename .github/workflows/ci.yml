name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install "setuptools>=68" wheel
      - run: python scripts/package_smoke.py
      - if: runner.os == 'Windows'
        run: |
          python windows/agent_pulse.py --fixture examples/demo.json --smoke
          python -c "import json,pathlib; p=pathlib.Path('.build'); p.mkdir(exist_ok=True); d=json.loads(pathlib.Path('examples/demo.json').read_text(encoding='utf-8')); d['providers'][1]['quotas']=d['providers'][0]['quotas']; (p/'two-quotas.json').write_text(json.dumps(d),encoding='utf-8')"
          python windows/agent_pulse.py --fixture .build/two-quotas.json --smoke
          python windows/agent_pulse.py --fixture .build/two-quotas.json --smoke --language ru
      - if: runner.os == 'macOS'
        run: |
          ./build.sh
          'dist/Agent Pulse.app/Contents/MacOS/AgentPulse' --fixture examples/demo.json --snapshot .build/widget.png
          python scripts/widget_smoke.py 'dist/Agent Pulse.app/Contents/MacOS/AgentPulse'
          python scripts/model_ui_smoke.py 'dist/Agent Pulse.app/Contents/MacOS/AgentPulse'
          python scripts/chart_ui_smoke.py 'dist/Agent Pulse.app/Contents/MacOS/AgentPulse'
